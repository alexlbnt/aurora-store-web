<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#232a3e" />
    <title>Sem conexão | Aurora</title>
    <style>
      :root {
        --tinta: #232a3e;
        --nevoa: #eeebf2;
        --indigo: #4b5a8c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--nevoa);
        color: var(--tinta);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid rgba(35, 42, 62, 0.1);
        border-radius: 8px;
        padding: 32px 24px;
      }
      img { width: 56px; height: 56px; border-radius: 12px; display: block; margin-bottom: 24px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 32px; line-height: 1.1; margin: 0 0 12px; }
      p { margin: 0 0 12px; line-height: 1.5; color: rgba(35, 42, 62, 0.8); }
      button {
        margin-top: 12px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: var(--tinta);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: var(--indigo); }
      button:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>O painel precisa de internet para abrir e para salvar vendas, clientes e produtos.</p>
      <p>Anote a venda e registre quando o sinal voltar. Esta tela recarrega sozinha quando a conexão voltar.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
